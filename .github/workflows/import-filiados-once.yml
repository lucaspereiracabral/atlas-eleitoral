name: Import Filiados Once
on:
  push:
    paths:
      - '.github/workflows/import-filiados-once.yml'
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Importar CSV para Supabase
        run: |
          set -e
          curl --fail-with-body -sS -X POST \
            'https://hcrxnoptatkzlghamykt.supabase.co/functions/v1/import-filiados' \
            -H 'x-import-token: Ib5KYj3FKQQnE9IpaTextT65uZfUIflx102wcxb8NsE' \
            -H 'content-type: application/json' \
            -d '{}'
