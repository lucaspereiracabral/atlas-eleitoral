name: Run age chart patch
on:
  push:
    paths:
      - '.github/workflows/run-age-chart-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_age_chart.py
      - run: |
          git config user.name "GeoCode"
          git config user.email "92799924+lucaspereiracabral@users.noreply.github.com"
          git add analytics.js
          git commit -m "Make age chart chronological and interactive"
          git push
