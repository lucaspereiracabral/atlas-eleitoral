name: Patch auth to secure RPC
on:
  push:
    paths:
      - '.github/workflows/patch-auth-rpc.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch auth flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('    async function liberarAtlas(user) {')
          end=s.index('    function bloquearAtlas() {', start)
          new='''    async function liberarAtlas(user) {\n        const emailAutenticado = String(user?.email || "").trim();\n\n        const { data: acessos, error: acessoError } = await supabaseClient\n            .rpc("atlas_acesso_atual");\n\n        const acesso = Array.isArray(acessos) ? acessos[0] : acessos;\n\n        if (acessoError) {\n            console.error("Erro ao validar autorização do Atlas:", acessoError);\n            bloquearAtlas();\n            setAuthMessage("Sua sessão Google foi criada, mas houve falha ao validar a autorização. Tente novamente em alguns segundos.");\n            return;\n        }\n\n        if (!acesso) {\n            console.warn("Usuário autenticado sem autorização ativa:", emailAutenticado);\n            bloquearAtlas();\n            setAuthMessage(`Conta autenticada sem autorização no Atlas: ${emailAutenticado || "e-mail não identificado"}.`);\n            return;\n        }\n\n        document.body.classList.remove("auth-locked");\n        setAuthMessage("");\n\n        const userEmail = document.getElementById("auth-user-email");\n        if (userEmail) {\n            const nome = acesso.nome || user?.user_metadata?.full_name || user?.email || "Usuário";\n            const perfil = (acesso.perfil || "visualizacao").toUpperCase();\n            userEmail.textContent = `${nome} • ${perfil}`;\n            userEmail.title = acesso.email || user?.email || "";\n        }\n\n        if (!atlasInicializado) {\n            atlasInicializado = true;\n            try {\n                await init();\n            } catch (e) {\n                atlasInicializado = false;\n                console.error("Erro ao inicializar o Atlas:", e);\n                document.body.classList.add("auth-locked");\n                setAuthMessage("Não foi possível carregar os dados protegidos do Atlas.");\n                return;\n            }\n        }\n\n        setTimeout(() => {\n            try { mapTRE.invalidateSize(); } catch (e) {}\n            try { mapIBGE.invalidateSize(); } catch (e) {}\n        }, 250);\n    }\n\n'''
          s=s[:start]+new+s[end:]

          old='''    supabaseClient.auth.onAuthStateChange(async (event, session) => {\n        if (event === "SIGNED_OUT") {\n            bloquearAtlas();\n            return;\n        }\n        if (session?.user) await liberarAtlas(session.user);\n    });'''
          newcb='''    supabaseClient.auth.onAuthStateChange((event, session) => {\n        if (event === "SIGNED_OUT") {\n            bloquearAtlas();\n            return;\n        }\n        if (session?.user) {\n            setTimeout(() => liberarAtlas(session.user), 0);\n        }\n    });'''
          if old in s:
              s=s.replace(old,newcb,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "GeoCode"
          git config user.email "92799924+lucaspereiracabral@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Use secure RPC for Atlas authorization"
          git push
