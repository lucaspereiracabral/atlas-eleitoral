name: Remove duplicate auth declaration
on:
  push:
    paths:
      - '.github/workflows/remove-duplicate-auth-let.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate declaration
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          duplicate='''    let authLiberacaoEmCurso = false;\n\n    let authLiberacaoEmCurso = false;'''
          if duplicate not in s:
              raise SystemExit('Duplicidade não encontrada')
          s=s.replace(duplicate, '    let authLiberacaoEmCurso = false;', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "GeoCode"
          git config user.email "92799924+lucaspereiracabral@users.noreply.github.com"
          git add index.html
          git commit -m "Remove duplicate auth state declaration" || exit 0
          git push
