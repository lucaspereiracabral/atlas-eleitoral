name: Enable Google Login

on:
  push:
    paths:
      - '.github/workflows/enable-google-login.yml'
      - '.github/scripts/enable_google_login.py'

permissions:
  contents: write

jobs:
  enable-google-login:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update index.html
        run: python .github/scripts/enable_google_login.py

      - name: Commit updated index.html
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable Google sign-in"
          git push
