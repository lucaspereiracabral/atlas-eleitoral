name: Modern Atlas UI Refresh
on:
  push:
    paths:
      - '.github/workflows/modern-ui-refresh.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append modern UI overrides
        run: |
          cat >> analytics.css <<'CSS'

/* =========================================================
   ATLAS UI 2026 — MODERN VISUAL REFRESH
   Visual-only overrides. No data or JS behavior changes.
   ========================================================= */
:root{
  --atlas-bg:#f4f7fb;
  --atlas-surface:#ffffff;
  --atlas-surface-soft:#f8fafc;
  --atlas-border:#e5eaf1;
  --atlas-text:#0f172a;
  --atlas-muted:#64748b;
  --atlas-primary:#2563eb;
  --atlas-primary-dark:#1d4ed8;
  --atlas-primary-soft:#eff6ff;
  --atlas-shadow:0 18px 50px -34px rgba(15,23,42,.35);
  --atlas-shadow-hover:0 20px 46px -28px rgba(37,99,235,.24);
  --atlas-radius:18px;
}

html,body{background:var(--atlas-bg)!important;color:var(--atlas-text)}
body{letter-spacing:-.01em}

header{
  background:rgba(255,255,255,.92)!important;
  border-bottom:1px solid rgba(226,232,240,.9)!important;
  box-shadow:0 8px 30px -26px rgba(15,23,42,.45)!important;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}

.brand{gap:12px!important}
.brand-logo{
  border-radius:12px!important;
  object-fit:contain!important;
  background:#fff!important;
}
.brand-text h1{
  color:#0f172a!important;
  font-weight:850!important;
  letter-spacing:-.7px!important;
}
.brand-text span{
  color:#64748b!important;
  font-weight:700!important;
  letter-spacing:.8px!important;
}

nav{gap:6px!important}
.nav-btn{
  border-radius:12px!important;
  color:#64748b!important;
  font-weight:750!important;
  transition:background .18s ease,color .18s ease,transform .18s ease!important;
}
.nav-btn:hover{background:#f8fafc!important;color:#1e40af!important}
.nav-btn.active{
  color:var(--atlas-primary)!important;
  background:var(--atlas-primary-soft)!important;
  box-shadow:inset 0 0 0 1px rgba(37,99,235,.07)!important;
}
.nav-btn.active::after{
  left:16%!important;
  right:16%!important;
  bottom:0!important;
  height:3px!important;
  border-radius:999px 999px 0 0!important;
}

.auth-logout,
.analytics-clear,
button{
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease!important;
}
.auth-logout:hover,.analytics-clear:hover,button:hover{transform:translateY(-1px)}
.auth-logout{
  border-radius:12px!important;
  background:#fff!important;
  border:1px solid var(--atlas-border)!important;
  box-shadow:0 8px 20px -18px rgba(15,23,42,.4)!important;
}

.container,.analytics-page{max-width:1500px!important}

.hero{
  border-radius:26px!important;
  background:linear-gradient(135deg,#0b1f49 0%,#153777 48%,#225bc1 100%)!important;
  box-shadow:0 30px 70px -42px rgba(15,46,110,.65)!important;
  overflow:hidden!important;
  position:relative!important;
}
.hero::before{
  content:"";
  position:absolute;
  width:380px;
  height:380px;
  border-radius:50%;
  right:-100px;
  top:-190px;
  background:radial-gradient(circle,rgba(96,165,250,.38),rgba(96,165,250,0) 68%);
  pointer-events:none;
}
.hero h2{letter-spacing:-1.3px!important;font-weight:850!important}
.hero p{color:rgba(255,255,255,.78)!important;max-width:850px!important}
.hero-eyebrow{color:#bfdbfe!important}
.hero-actions button{
  border-radius:12px!important;
  min-height:46px!important;
  box-shadow:0 10px 24px -18px rgba(0,0,0,.45)!important;
}

.kpi-grid{gap:16px!important}
.kpi-card,
.analytics-kpi,
.analytics-card{
  background:linear-gradient(180deg,#fff 0%,#fcfdff 100%)!important;
  border:1px solid var(--atlas-border)!important;
  border-radius:var(--atlas-radius)!important;
  box-shadow:var(--atlas-shadow)!important;
}
.kpi-card{
  position:relative!important;
  overflow:hidden!important;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease!important;
}
.kpi-card:hover,.analytics-kpi:hover,.analytics-card:hover{
  transform:translateY(-2px);
  border-color:#dbe4f0!important;
  box-shadow:var(--atlas-shadow-hover)!important;
}
.kpi-card::after{
  content:"";
  position:absolute;
  left:0;top:0;right:0;height:3px;
  background:linear-gradient(90deg,#2563eb,#60a5fa);
  opacity:.9;
}
.kpi-title,.analytics-kpi span{color:#64748b!important;letter-spacing:.8px!important}
.kpi-value,.analytics-kpi strong{color:#0f172a!important;font-weight:850!important;letter-spacing:-1px!important}
.kpi-sub,.analytics-kpi small{color:#94a3b8!important}

.map-layout{background:var(--atlas-bg)!important}
.sidebar,.map-container{
  border:1px solid var(--atlas-border)!important;
  border-radius:20px!important;
  box-shadow:var(--atlas-shadow)!important;
  overflow:hidden!important;
}
.sidebar{background:#fff!important}
.sidebar-header{
  background:linear-gradient(180deg,#fff 0%,#fbfdff 100%)!important;
  border-bottom:1px solid #eef2f7!important;
}
.sidebar-header h3{color:#0f172a!important;font-weight:850!important;letter-spacing:-.35px!important}
.sidebar-header p{color:#64748b!important}
.search-input,.select-input,.analytics-filters select{
  background:#fff!important;
  border:1px solid #dfe6ef!important;
  border-radius:12px!important;
  box-shadow:0 3px 10px -9px rgba(15,23,42,.25)!important;
  transition:border-color .18s ease,box-shadow .18s ease!important;
}
.search-input:focus,.select-input:focus,.analytics-filters select:focus{
  border-color:#93c5fd!important;
  box-shadow:0 0 0 4px rgba(59,130,246,.10)!important;
  outline:none!important;
}
.list-item{
  border-bottom:1px solid #f0f3f7!important;
  transition:background .16s ease,transform .16s ease!important;
}
.list-item:hover{background:#f8fbff!important}
.list-item.active{background:#eff6ff!important;box-shadow:inset 3px 0 0 #2563eb!important}
.badge{border-radius:999px!important;font-weight:800!important}
.sub-item{border-radius:10px!important}

.map-container{background:#eaf0f6!important}
.leaflet-control-zoom{
  border:none!important;
  box-shadow:0 12px 30px -18px rgba(15,23,42,.5)!important;
}
.leaflet-control-zoom a{
  border-color:#e2e8f0!important;
  color:#0f172a!important;
}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{
  box-shadow:0 18px 45px -24px rgba(15,23,42,.55)!important;
}
.leaflet-popup-content-wrapper{border-radius:14px!important}

.buffer-tool{
  background:linear-gradient(180deg,#fffdf6 0%,#fffaf0 100%)!important;
  border:1px solid #f6d77a!important;
  border-radius:16px!important;
  box-shadow:0 16px 38px -28px rgba(180,83,9,.42)!important;
}
.buffer-result{border-radius:14px!important;background:#fff!important;border:1px solid #fde7a8!important}
.legend{background:#fff!important;border-top:1px solid #eef2f7!important}

.analytics-head{margin-bottom:24px!important}
.analytics-head h2{font-weight:850!important;letter-spacing:-.9px!important}
.analytics-filters{
  padding:12px!important;
  background:rgba(255,255,255,.82)!important;
  border:1px solid var(--atlas-border)!important;
  border-radius:16px!important;
  box-shadow:0 10px 28px -24px rgba(15,23,42,.35)!important;
}
.analytics-clear{background:#f8fafc!important;border-color:#e2e8f0!important;border-radius:12px!important}
.analytics-grid{gap:18px!important}
.analytics-card{padding:22px!important}
.analytics-card h3{font-weight:850!important;letter-spacing:-.3px!important}
.analytics-selection{border-radius:999px!important}

.future-module-card,
.future-module-hero,
.future-card{
  border-radius:20px!important;
  box-shadow:var(--atlas-shadow)!important;
}

/* cleaner scrollbars on desktop */
@media(min-width:701px){
  *{scrollbar-width:thin;scrollbar-color:#cbd5e1 transparent}
  *::-webkit-scrollbar{width:8px;height:8px}
  *::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:999px}
  *::-webkit-scrollbar-track{background:transparent}
}

@media(max-width:700px){
  body{background:#f5f7fb!important}
  header{
    height:124px!important;
    min-height:124px!important;
    padding:10px 12px 8px!important;
    background:rgba(255,255,255,.96)!important;
    box-shadow:0 10px 26px -24px rgba(15,23,42,.5)!important;
  }
  .brand-logo{width:34px!important;height:34px!important;border-radius:10px!important}
  .brand-text h1{font-size:14px!important;font-weight:850!important}
  nav{padding:3px 0 4px!important;gap:6px!important}
  .nav-btn{
    height:42px!important;
    padding:0 13px!important;
    border-radius:12px!important;
    background:#fff!important;
    border:1px solid transparent!important;
  }
  .nav-btn.active{
    background:#eef5ff!important;
    border-color:#dbeafe!important;
  }
  .tab-content{height:calc(100dvh - 124px)!important;max-height:calc(100dvh - 124px)!important}
  .container{padding:14px 12px 28px!important}
  .hero{border-radius:20px!important;padding:28px 22px!important}
  .hero h2{font-size:29px!important;letter-spacing:-1.1px!important}
  .hero p{font-size:12px!important}
  .kpi-grid{gap:10px!important}
  .kpi-card{border-radius:16px!important;padding:18px 15px!important}
  .kpi-value{font-size:25px!important}
  .map-layout{padding:10px!important;gap:10px!important}
  .sidebar,.map-container{border-radius:16px!important}
  .sidebar-header{padding:15px!important}
  .search-input,.select-input{border-radius:12px!important}
  .analytics-page{padding:14px 10px 28px!important}
  .analytics-filters{
    padding:9px!important;
    border-radius:14px!important;
    background:rgba(255,255,255,.96)!important;
  }
  .analytics-card,.analytics-kpi{border-radius:16px!important}
  .analytics-card{padding:16px 14px!important}
  #mapas-tre .map-container,#mapas-ibge .map-container{border-radius:16px!important}
}

@media(max-width:390px){
  header{height:120px!important;min-height:120px!important}
  .tab-content{height:calc(100dvh - 120px)!important;max-height:calc(100dvh - 120px)!important}
  .brand-text h1{font-size:13px!important}
  .hero h2{font-size:26px!important}
}
CSS
      - name: Commit visual refresh
        run: |
          git config user.name "GeoCode"
          git config user.email "92799924+lucaspereiracabral@users.noreply.github.com"
          rm .github/workflows/modern-ui-refresh.yml
          git add analytics.css .github/workflows/modern-ui-refresh.yml
          git commit -m "Modernize Atlas interface" || exit 0
          git push
