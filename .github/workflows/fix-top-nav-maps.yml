name: Fix Top Navigation and Maps
on:
  push:
    paths:
      - '.github/workflows/fix-top-nav-maps.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir navegacao e mapas
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('src="atlas%20logo.png"','src="atlas_logo_.png"')

          old='''    <nav>\n        <button class="nav-btn" onclick="mudarAba('mapas-tre', this)">Mapa locais de votação</button>\n        <button class="nav-btn" onclick="mudarAba('mapas-ibge', this)">Mapa aptos a votar</button>\n    </nav>'''
          new='''    <nav>\n        <button class="nav-btn" onclick="mudarAba('mapas-tre', this)">Locais de Votação</button>\n        <button class="nav-btn" onclick="mudarAba('mapas-ibge', this)">População Eleitoral</button>\n        <button class="nav-btn" onclick="atlasAnalyticsTab('tab-eleitorado', this)">Perfil do Eleitorado</button>\n        <button class="nav-btn" onclick="atlasAnalyticsTab('tab-filiacoes', this)">Filiação Partidária</button>\n    </nav>'''
          if old in s:
              s=s.replace(old,new,1)

          s=s.replace('Plataforma de inteligência geográfica para análise territorial do eleitorado de Itajaí. Integra dados do TRE-SC e do Censo Demográfico 2022 do IBGE, permitindo visualizar a distribuição dos eleitores, os locais de votação e a população em idade eleitoral no município.',
          'Plataforma de inteligência geográfica para leitura integrada do território eleitoral de Itajaí, reunindo informações oficiais e análises espaciais para compreender a distribuição do eleitorado, dos locais de votação e da população em idade eleitoral no município.')

          old_func='''        setTimeout(() => {\n            mapTRE.invalidateSize();\n            mapIBGE.invalidateSize();\n            if(idAba === 'estatisticas') {\n                Object.values(Chart.instances).forEach(chart => chart.resize());\n            }\n        }, 150);'''
          new_func='''        setTimeout(() => {\n            try { mapTRE.invalidateSize(true); } catch(e) {}\n            try { mapIBGE.invalidateSize(true); } catch(e) {}\n\n            if(idAba === 'mapas-tre') {\n                try {\n                    if (camadaBairrosTRE && !mapTRE.hasLayer(camadaBairrosTRE)) camadaBairrosTRE.addTo(mapTRE);\n                    if (camadaLocaisTRE && !mapTRE.hasLayer(camadaLocaisTRE)) camadaLocaisTRE.addTo(mapTRE);\n                    filtrarTRE();\n                    mapTRE.invalidateSize(true);\n                } catch(e) { console.error('Erro ao restaurar mapa TRE:', e); }\n            }\n\n            if(idAba === 'mapas-ibge') {\n                try { mapIBGE.invalidateSize(true); } catch(e) {}\n            }\n\n            if(idAba === 'estatisticas') {\n                Object.values(Chart.instances).forEach(chart => chart.resize());\n            }\n        }, 180);'''
          if old_func in s:
              s=s.replace(old_func,new_func,1)

          p.write_text(s,encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          p=Path('analytics.js')
          s=p.read_text(encoding='utf-8')
          start="function buildNav(){"
          end="function polish(){"
          if start in s and end in s:
              a=s.index(start); b=s.index(end)
              s=s[:a]+"function buildNav(){ /* navegação declarada diretamente no index.html */ }\n"+s[b:]
          p.write_text(s,encoding='utf-8')
          PY

      - name: Publicar correcao
        run: |
          rm .github/workflows/fix-top-nav-maps.yml
          git config user.name "GeoCode"
          git config user.email "92799924+lucaspereiracabral@users.noreply.github.com"
          git add index.html analytics.js .github/workflows/fix-top-nav-maps.yml
          git commit -m "Restore voting locations map and four-tab navigation"
          git push