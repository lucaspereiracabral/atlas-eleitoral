name: Fix population buffer calculation
on:
  push:
    paths:
      - '.github/workflows/fix-buffer-population.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch buffer population calculation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('    function atualizarBuffer() {')
          end = s.find('    /* =========================================================\n       GRÁFICOS', start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate atualizarBuffer function block')

          new_fn = r'''    function atualizarBuffer() {
        if (!geoSetores || !Array.isArray(geoSetores.features) || !bufferLatLng) {
            return;
        }

        const raioM = Number(document.getElementById("buffer-slider").value || 500);
        const raioKm = raioM / 1000;
        document.getElementById("buffer-raio").innerText = raioM + "m";

        // Círculo visual no Leaflet.
        if (bufferCircle) mapIBGE.removeLayer(bufferCircle);
        bufferCircle = L.circle(bufferLatLng, {
            radius: raioM,
            color: "#f59e0b",
            fillColor: "#f59e0b",
            fillOpacity: 0.22,
            weight: 2,
            interactive: false
        }).addTo(mapIBGE);

        // Buffer geográfico Turf em WGS84.
        const centro = turf.point([
            Number(bufferLatLng.lng),
            Number(bufferLatLng.lat)
        ]);
        const areaRaio = turf.buffer(centro, raioKm, {
            units: "kilometers",
            steps: 64
        });

        let populacaoBuffer = 0;
        let setoresSelecionados = 0;

        geoSetores.features.forEach(sec => {
            if (!sec || !sec.geometry) return;

            const popApta = calcularPopulacaoApta2026(sec.properties || {});
            if (!(popApta > 0)) return;

            let intersecta = false;

            try {
                // Critério principal: qualquer interseção do setor com o raio.
                intersecta = turf.booleanIntersects(sec, areaRaio);
            } catch (e) {
                // Fallback para geometrias que causem erro no booleanIntersects.
                try {
                    const centroide = turf.centroid(sec);
                    const distanciaKm = turf.distance(centro, centroide, {
                        units: "kilometers"
                    });
                    intersecta = Number.isFinite(distanciaKm) && distanciaKm <= raioKm;
                } catch (err) {
                    intersecta = false;
                }
            }

            if (intersecta) {
                populacaoBuffer += popApta;
                setoresSelecionados++;
            }
        });

        const resultado = Math.max(0, Math.round(populacaoBuffer));
        document.getElementById("buffer-resultado").innerText = format(resultado);

        console.info("BUFFER POPULAÇÃO APTA 2026", {
            centro: [bufferLatLng.lat, bufferLatLng.lng],
            raioM,
            setoresSelecionados,
            resultado
        });
    }

'''
          s = s[:start] + new_fn + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "GeoCode"
          git config user.email "92799924+lucaspereiracabral@users.noreply.github.com"
          git add index.html
          git commit -m "Sum electoral population of sectors intersecting buffer" || exit 0
          git push
