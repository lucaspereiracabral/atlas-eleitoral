name: Force evolution module cache refresh
on:
  push:
    paths:
      - '.github/workflows/bump-evolution-v8.yml'
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump future modules cache version
        run: sed -i 's/future-modules.js?v=7/future-modules.js?v=8/g' index.html
      - name: Commit
        run: |
          git config user.name "GeoCode"
          git config user.email "92799924+lucaspereiracabral@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Load election evolution module v8"
          git push
