name: Fix OAuth Callback

on:
  push:
    paths:
      - '.github/workflows/fix-oauth-callback.yml'

permissions:
  contents: write

jobs:
  fix-callback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: python scripts/fix_oauth_callback.py
      - name: Commit fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Google OAuth callback session"
          git push
