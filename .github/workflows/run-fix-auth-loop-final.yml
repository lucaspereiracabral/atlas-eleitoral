name: Run OAuth loop final fix
on:
  push:
    paths:
      - '.github/workflows/run-fix-auth-loop-final.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final auth loop fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('    async function liberarAtlas(user) {')
          end=s.index('    async function entrarComGoogle() {', start)
          novo='''    let authLiberacaoEmCurso = false;\n\n    async function liberarAtlas(user) {\n        if (!user || authLiberacaoEmCurso) return;\n        authLiberacaoEmCurso = true;\n\n        try {\n            document.body.classList.remove("auth-locked");\n            setAuthMessage("");\n\n            const userEmail = document.getElementById("auth-user-email");\n            if (userEmail) {\n                const nome = user?.user_metadata?.full_name || user?.email || "Usuário";\n                userEmail.textContent = nome;\n                userEmail.title = user?.email || "";\n            }\n\n            if (!atlasInicializado) {\n                atlasInicializado = true;\n                try {\n                    await init();\n                } catch (e) {\n                    atlasInicializado = false;\n                    console.error("Erro ao carregar dados protegidos do Atlas:", e);\n                    document.body.classList.add("auth-locked");\n                    setAuthMessage("Conta autenticada, mas sem acesso aos dados protegidos do Atlas.");\n                    return;\n                }\n            }\n\n            setTimeout(() => {\n                try { mapTRE.invalidateSize(); } catch (e) {}\n                try { mapIBGE.invalidateSize(); } catch (e) {}\n            }, 250);\n        } finally {\n            authLiberacaoEmCurso = false;\n        }\n    }\n\n    function bloquearAtlas() {\n        document.body.classList.add("auth-locked");\n        const userEmail = document.getElementById("auth-user-email");\n        if (userEmail) userEmail.textContent = "";\n    }\n\n\n'''
          s=s[:start]+novo+s[end:]
          start=s.index('    async function verificarSessaoAtlas() {')
          end=s.index('    verificarSessaoAtlas();', start)
          novo2='''    async function verificarSessaoAtlas() {\n        try {\n            const { data: { session }, error } = await supabaseClient.auth.getSession();\n            if (error) {\n                console.error("Erro ao verificar sessão:", error);\n                bloquearAtlas();\n                setAuthMessage("Não foi possível validar a sessão.");\n                return;\n            }\n\n            if (session?.user) {\n                const cleanUrl = window.location.origin + window.location.pathname;\n                if (window.location.search || window.location.hash) {\n                    window.history.replaceState({}, document.title, cleanUrl);\n                }\n                await liberarAtlas(session.user);\n            } else {\n                bloquearAtlas();\n            }\n        } catch (e) {\n            console.error("Erro ao verificar sessão do Atlas:", e);\n            bloquearAtlas();\n        }\n    }\n\n    supabaseClient.auth.onAuthStateChange((event, session) => {\n        console.info("Supabase auth event:", event);\n        if (event === "SIGNED_OUT") {\n            bloquearAtlas();\n            return;\n        }\n        if ((event === "SIGNED_IN" || event === "INITIAL_SESSION" || event === "TOKEN_REFRESHED") && session?.user) {\n            setTimeout(() => liberarAtlas(session.user), 0);\n        }\n    });\n\n'''
          s=s[:start]+novo2+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "GeoCode"
          git config user.email "92799924+lucaspereiracabral@users.noreply.github.com"
          git add index.html
          git commit -m "Fix OAuth login loop and rely on RLS" || exit 0
          git push
