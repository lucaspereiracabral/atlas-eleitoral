name: Frontend Professional V2
on: [push]
permissions:
  contents: write
jobs:
  update:
    if: github.event.head_commit.message == 'Run frontend professional redesign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/frontend_update_v1.py
      - run: rm scripts/frontend_update_v1.py .github/workflows/frontend-professional-v2.yml
      - run: git config user.name GeoCode && git config user.email 92799924+lucaspereiracabral@users.noreply.github.com && git add -A && git commit -m 'Redesign Atlas landing page and navigation' && git push