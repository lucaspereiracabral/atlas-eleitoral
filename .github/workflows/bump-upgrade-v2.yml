name: Force dashboard cleanup and chart readability refresh
on:
  push:
    paths:
      - '.github/workflows/bump-upgrade-v2.yml'
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump upgrade loader
        run: |
          sed -i 's/upgrade-v3.js?v=1/upgrade-v3.js?v=2/g' index.html
      - name: Commit
        run: |
          git config user.name 'GeoCode'
          git config user.email '92799924+lucaspereiracabral@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Refresh dashboard cleanup and chart readability'
          git push