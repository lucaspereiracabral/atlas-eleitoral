name: Run auth lookup fix
on:
  push:
    paths:
      - '.github/workflows/run-fix-auth-lookup.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch auth lookup
        run: python .github/scripts/fix_auth_lookup.py
      - name: Commit
        run: |
          git config user.name 'GeoCode'
          git config user.email '92799924+lucaspereiracabral@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix authorized user login lookup'
          git push