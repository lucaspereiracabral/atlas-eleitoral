name: Fix Populacao Apta Setores
on:
  push:
    paths:
      - '.github/workflows/fix-populacao-apta-setores.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sector population and buffer calculation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # 1) remove obsolete explanatory block that mentioned 80% of 15-19
          obsolete='''    /*\n     * Estimativa da população apta a votar em 2026 (16 anos ou mais).\n     *\n     * O Censo 2022 desta base fornece:\n     * V01034 = 15 a 19 anos\n     * V01035 = 20 a 24 anos\n     * V01036 = 25 a 29 anos\n     * V01037 = 30 a 39 anos\n     * V01038 = 40 a 49 anos\n     * V01039 = 50 a 59 anos\n     * V01040 = 60 a 69 anos\n     * V01041 = 70 anos ou mais\n     *\n     * Como não há uma variável separada apenas para 15 anos,\n     * estimamos 16-19 como 4/5 (80%) da faixa 15-19.\n     */\n'''
          s=s.replace(obsolete,'')

          # 2) precompute a stable field on every census feature
          old='''        geoBairros = bairros;\n        geoSetores = setores;\n\n        prepararIndiceBairros();'''
          new='''        geoBairros = bairros;\n        geoSetores = setores;\n\n        // Calcula uma única vez a população apta a votar em 2026 por setor.\n        // Metodologia: 60% de V01033 (10-14 em 2022) + 100% de V01034..V01041.\n        if (geoSetores && Array.isArray(geoSetores.features)) {\n            geoSetores.features.forEach(setor => {\n                const props = setor.properties || (setor.properties = {});\n                props.pop_apta_2026 = Math.round(calcularPopulacaoApta2026(props));\n            });\n        }\n\n        prepararIndiceBairros();'''
          if old not in s:
              raise SystemExit('init marker not found')
          s=s.replace(old,new,1)

          # 3) use the precomputed field in total processing
          s=s.replace('''                const pop16Mais = calcularPopulacao16Mais(props);''','''                const pop16Mais = parseNum(props.pop_apta_2026);''')

          # 4) use it in choropleth styling and popup
          s=s.replace('''                    const popApta = calcularPopulacaoApta2026(f.properties || {});''','''                    const popApta = parseNum((f.properties || {}).pop_apta_2026);''')
          s=s.replace('''                    const popApta = Math.round(calcularPopulacaoApta2026(p));''','''                    const popApta = Math.round(parseNum(p.pop_apta_2026));''')

          # 5) use it in bairro aggregation
          s=s.replace('''            const popApta = calcularPopulacaoApta2026(props);''','''            const popApta = parseNum(props.pop_apta_2026 ?? calcularPopulacaoApta2026(props));''',1)

          # 6) replace full buffer estimator with areal intersection + sampling fallback
          start=s.find('    function atualizarBuffer() {')
          end=s.find('    /* =========================================================\n       GRÁFICOS', start)
          if start < 0 or end < 0:
              raise SystemExit('buffer block markers not found')

          replacement=r'''    function atualizarBuffer() {
        if (!geoSetores || !bufferLatLng) return;

        const raioM = Number(document.getElementById("buffer-slider").value);
        document.getElementById("buffer-raio").innerText = raioM + "m";

        if (bufferCircle) mapIBGE.removeLayer(bufferCircle);
        bufferCircle = L.circle(bufferLatLng, {
            radius: raioM,
            color: "#f59e0b",
            fillColor: "#f59e0b",
            fillOpacity: 0.22,
            weight: 2,
            interactive: false
        }).addTo(mapIBGE);

        // Buffer Turf em WGS84, no mesmo sistema de coordenadas do GeoJSON.
        const centro = [Number(bufferLatLng.lng), Number(bufferLatLng.lat)];
        const bufferGeo = turf.circle(centro, raioM / 1000, {
            steps: 96,
            units: "kilometers"
        });

        let populacaoBuffer = 0;
        let setoresComContribuicao = 0;
        let setoresPorIntersecao = 0;
        let setoresPorAmostragem = 0;

        geoSetores.features.forEach(sec => {
            const props = sec.properties || {};
            const popApta = parseNum(props.pop_apta_2026 ?? calcularPopulacaoApta2026(props));
            if (popApta <= 0 || !sec.geometry) return;

            let proporcao = 0;

            // Método principal: proporção da área do setor efetivamente dentro do raio.
            try {
                const areaSetor = turf.area(sec);
                if (areaSetor > 0) {
                    const inter = turf.intersect(sec, bufferGeo);
                    if (inter) {
                        const areaDentro = turf.area(inter);
                        proporcao = Math.max(0, Math.min(1, areaDentro / areaSetor));
                        if (proporcao > 0) setoresPorIntersecao++;
                    }
                }
            } catch (e) {
                proporcao = 0;
            }

            // Fallback robusto para geometrias que Turf não consiga intersectar.
            if (proporcao <= 0) {
                try {
                    const amostras = obterAmostrasSetor(sec);
                    if (amostras.length) {
                        let dentro = 0;
                        amostras.forEach(p => {
                            const pt = turf.point([Number(p.lng), Number(p.lat)]);
                            if (turf.booleanPointInPolygon(pt, bufferGeo)) dentro++;
                        });
                        if (dentro > 0) {
                            proporcao = dentro / amostras.length;
                            setoresPorAmostragem++;
                        }
                    }
                } catch (e) {}
            }

            if (proporcao > 0) {
                populacaoBuffer += popApta * proporcao;
                setoresComContribuicao++;
            }
        });

        const resultado = Math.round(populacaoBuffer);
        document.getElementById("buffer-resultado").innerText = format(resultado);

        console.group("BUFFER POPULAÇÃO APTA 2026");
        console.log("Centro:", centro);
        console.log("Raio:", raioM, "m");
        console.log("Setores contribuindo:", setoresComContribuicao);
        console.log("Por interseção de área:", setoresPorIntersecao);
        console.log("Por amostragem (fallback):", setoresPorAmostragem);
        console.log("População apta estimada no raio:", resultado);
        console.groupEnd();
    }

'''
          s=s[:start]+replacement+s[end:]

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "GeoCode"
          git config user.email "92799924+lucaspereiracabral@users.noreply.github.com"
          rm .github/workflows/fix-populacao-apta-setores.yml
          git add index.html .github/workflows/fix-populacao-apta-setores.yml
          git commit -m "Fix population voting-age values by census sector"
          git push