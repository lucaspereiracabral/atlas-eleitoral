name: Add future modules loader
on:
  push:
    paths:
      - '.github/workflows/add-future-modules.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add module script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='    <script src="analytics.js?v=1"></script>'
          new='    <script src="analytics.js?v=1"></script>\n    <script src="future-modules.js?v=1"></script>'
          if 'future-modules.js' not in s:
              if old not in s: raise SystemExit('analytics script tag not found')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "GeoCode"
          git config user.email "92799924+lucaspereiracabral@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add future territorial analysis modules"
          git push
