name: Stop auth loop on data load error
on:
  push:
    paths:
      - '.github/auth-loop-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix OAuth callback race
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''    async function verificarSessaoAtlas() {
        try {
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            if (error) {
                console.error("Erro ao verificar sessão:", error);
                bloquearAtlas();
                setAuthMessage("Não foi possível validar a sessão.");
                return;
            }

            if (session?.user) {
                const cleanUrl = window.location.origin + window.location.pathname;
                if (window.location.search || window.location.hash) {
                    window.history.replaceState({}, document.title, cleanUrl);
                }
                await liberarAtlas(session.user);
            } else {
                bloquearAtlas();
            }
        } catch (e) {
            console.error("Erro ao verificar sessão do Atlas:", e);
            bloquearAtlas();
        }
    }'''
          new = '''    async function verificarSessaoAtlas(tentativa = 0) {
        try {
            const params = new URLSearchParams(window.location.search);
            const retornoOAuth = params.has("code") || window.location.hash.includes("access_token") || window.location.hash.includes("error");

            const { data: { session }, error } = await supabaseClient.auth.getSession();
            if (error) {
                console.error("Erro ao verificar sessão:", error);
                if (retornoOAuth && tentativa < 8) {
                    setTimeout(() => verificarSessaoAtlas(tentativa + 1), 400);
                    return;
                }
                bloquearAtlas();
                setAuthMessage("Não foi possível validar a sessão.");
                return;
            }

            if (session?.user) {
                const cleanUrl = window.location.origin + window.location.pathname;
                if (window.location.search || window.location.hash) {
                    window.history.replaceState({}, document.title, cleanUrl);
                }
                await liberarAtlas(session.user);
            } else if (retornoOAuth && tentativa < 8) {
                console.info("Aguardando conclusão do callback OAuth... tentativa", tentativa + 1);
                setTimeout(() => verificarSessaoAtlas(tentativa + 1), 400);
            } else {
                bloquearAtlas();
            }
        } catch (e) {
            console.error("Erro ao verificar sessão do Atlas:", e);
            if (tentativa < 8) {
                setTimeout(() => verificarSessaoAtlas(tentativa + 1), 400);
            } else {
                bloquearAtlas();
            }
        }
    }'''
          if old not in s:
              raise SystemExit('Função verificarSessaoAtlas atual não encontrada')
          s = s.replace(old, new, 1)
          old_evt = '''        if (event === "SIGNED_OUT") {
            bloquearAtlas();
            return;
        }'''
          new_evt = '''        if (event === "SIGNED_OUT") {
            const params = new URLSearchParams(window.location.search);
            if (params.has("code")) {
                console.info("SIGNED_OUT transitório durante callback OAuth ignorado.");
                return;
            }
            bloquearAtlas();
            return;
        }'''
          if old_evt in s:
              s = s.replace(old_evt, new_evt, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "GeoCode"
          git config user.email "92799924+lucaspereiracabral@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix OAuth callback session race"
          git push
