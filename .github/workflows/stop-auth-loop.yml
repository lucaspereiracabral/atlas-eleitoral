name: Stop auth loop on data load error
on:
  push:
    paths:
      - '.github/auth-loop-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep authenticated session open when init fails
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          needle = 'console.error("Erro ao carregar dados protegidos do Atlas:", e);'
          if needle not in s:
              raise SystemExit('Mensagem de erro do init não encontrada')
          insert = '''console.error("Erro ao carregar dados protegidos do Atlas:", e);\n                    document.body.classList.remove("auth-locked");\n                    setAuthMessage("");\n                    const loader = document.getElementById("loader");\n                    if (loader) loader.style.display = "none";\n                    const inicio = document.getElementById("inicio");\n                    if (inicio && !document.getElementById("atlas-load-error")) {\n                        const aviso = document.createElement("div");\n                        aviso.id = "atlas-load-error";\n                        aviso.style.cssText = "margin:16px auto;max-width:900px;padding:14px 16px;border:1px solid #fecaca;background:#fff7f7;color:#991b1b;border-radius:10px;font:600 12px/1.5 Arial,sans-serif";\n                        aviso.textContent = "Sessão autenticada. Houve erro ao carregar um ou mais dados protegidos. Abra o console do navegador para ver o detalhe técnico.";\n                        inicio.prepend(aviso);\n                    }'''
          s = s.replace(needle, insert, 1)
          # neutraliza qualquer relock imediatamente dentro do mesmo catch
          marker = insert
          pos = s.find(marker)
          if pos >= 0:
              tail_start = pos + len(marker)
              tail = s[tail_start:tail_start+500]
              tail = tail.replace('document.body.classList.add("auth-locked");', 'document.body.classList.remove("auth-locked");', 1)
              tail = tail.replace('setAuthMessage("Conta autenticada, mas sem acesso aos dados protegidos do Atlas.");', 'setAuthMessage("");', 1)
              s = s[:tail_start] + tail + s[tail_start+500:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "GeoCode"
          git config user.email "92799924+lucaspereiracabral@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Stop auth loop when protected data load fails"
          git push
